name: Revisión semanal

# The sources change rarely: Spain reports to the EEA every two years and the bathing water
# classification comes out once a year (around June). Every Monday the bot checks whether either
# has a new release and only then fetches, links and publishes. Pages serves main:/docs.
on:
  schedule:
    - cron: "30 6 * * 1"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even if no source changed"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: weekly
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

      - name: New release?
        id: check
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ] || python -m wastewater.cli check; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing new."
          fi

      # HydroRIVERS (68 MB) and the municipalities layer do not change between runs.
      - uses: actions/cache@v4
        if: steps.check.outputs.build == 'true'
        with:
          path: .cache
          key: inputs-hydrorivers-v10-es-atlas-0.6.0

      - name: Fetch, link and render
        if: steps.check.outputs.build == 'true'
        run: python -m wastewater.cli all

      - name: Commit
        if: steps.check.outputs.build == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "Nothing new."
          else
            git commit -m "Datos al $(date -u +%Y-%m-%d)"
            git push origin HEAD:main
          fi
