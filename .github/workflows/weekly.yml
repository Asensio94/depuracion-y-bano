name: Revisión semanal

# The sources change rarely: Spain and France report to the EEA every two years, the bathing water
# classification comes out once a year (around June), the French ERU portal publishes a new year of
# verdicts once a year and the French Ministry of Health one bathing season. Every Monday the bot
# checks whether any has a new release and only then fetches, links and publishes both pages.
# Pages serves main:/docs.
on:
  schedule:
    - cron: "30 6 * * 1"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even if no source changed"
        type: boolean
        default: false
      web_only:
        description: "Only re-render the pages from the stored data (no download)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: weekly
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

      - name: New release?
        id: check
        if: github.event.inputs.web_only != 'true'
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ] || python -m wastewater.cli check; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing new."
          fi

      # The pages read only data/ (links included), so a text change can be published without
      # downloading anything. HydroRIVERS refuses GitHub's runners (403 from Cloudflare), which makes
      # this the way to republish while the cache below is empty.
      - name: Render only
        if: github.event.inputs.web_only == 'true'
        run: python -m wastewater.cli page

      # HydroRIVERS (68 MB) and the municipalities layer do not change between runs. GitHub drops a
      # cache unused for 7 days and the download is refused from the runners, so it is restored every
      # week, build or not, to keep it alive.
      - uses: actions/cache@v4
        with:
          path: .cache
          key: inputs-hydrorivers-v10-es-atlas-0.6.0

      - name: Fetch, link and render
        if: steps.check.outputs.build == 'true'
        run: python -m wastewater.cli all

      - name: Commit
        if: steps.check.outputs.build == 'true' || github.event.inputs.web_only == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "Nothing new."
          else
            git commit -m "Datos al $(date -u +%Y-%m-%d)"
            git push origin HEAD:main
          fi
